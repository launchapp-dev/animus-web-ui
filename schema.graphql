An attachment carried by a [`Subject`].
"""
type SubjectAttachment {
	id: String!
	kind: String!
	uri: String!
	title: String
	mimeType: String
	"""
	Free-form backend metadata, serialized as a JSON string.
	"""
	metadata: String
}

