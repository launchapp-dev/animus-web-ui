schema = "animus.plugin.v1"
name = "animus-web-ui"
version = "0.1.2"
plugin_kind = "transport_backend"
description = "Serves the bundled Animus React web UI over HTTP"

[capabilities]
streaming = false
progress = false
cancellation = false
methods = [
  "transport/start",
  "transport/shutdown",
  "transport/schema",
  "health/check",
  "$ui/web",
]

[transport]
kinds = ["http", "static"]
default_port = 8082
supports_streaming = false
supports_websocket = true

[binary]
default = "animus-web-ui"
